[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ui",
    "crates/services",
    "apps/hub/backend",
    "apps/hub/frontend",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["Allfeat <hello@allfeat.com>"]
license = "GPL-3.0"
repository = "https://github.com/allfeat/allfeat-apps"
homepage = "https://allfeat.org"
description = "Allfeat Apps Hub - Unified platform for music metadata registration"
keywords = ["allfeat", "blockchain", "music", "midds", "metadata"]

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

# Validation
jsonschema = "0.37"
regex = "1.10"

# Async
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# Web Backend
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs", "compression-gzip"] }
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"

# CSV parsing
csv = "1.3"
chardet = "0.2"
encoding_rs = "0.8"

# Web Frontend (WASM)
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
leptos_meta = { version = "0.6", features = ["csr"] }
leptos_dom = { version = "0.6", features = ["csr"] }
leptos_macro = { version = "0.6", features = ["csr"] }
leptos_reactive = { version = "0.6", features = ["csr"] }
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
gloo-net = "0.6"
gloo-utils = "0.2"
gloo-timers = { version = "0.3", features = ["futures"] }
serde-wasm-bindgen = "0.6"
console_log = "1.0"
console_error_panic_hook = "0.1"
log = "0.4"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
hex = "0.4"
once_cell = "1.21"

# Internal crates
allfeat-core = { path = "crates/core" }
allfeat-ui = { path = "crates/ui" }
allfeat-services = { path = "crates/services" }
