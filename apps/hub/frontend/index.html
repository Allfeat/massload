<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allfeat Apps Hub</title>
    <!-- Google Fonts for CJK support (Korean, Japanese, Chinese) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link data-trunk rel="css" href="style/main.css">
    <link data-trunk rel="css" href="style/sidebar.css">
    <link data-trunk rel="css" href="style/accordion.css">
    <link data-trunk rel="css" href="style/form.css">
    <link data-trunk rel="copy-dir" href="public/">
    <!-- Runtime config - MUST load before WASM -->
    <script src="/config.js"></script>
    <!-- Fallback config for local development (if config.js doesn't exist) -->
    <script>
        if (!window.ALLFEAT_CONFIG) {
            console.log("[Allfeat] No runtime config found, using defaults");
            window.ALLFEAT_CONFIG = {
                BACKEND_URL: "http://localhost:3000",
                BLOCKCHAIN_RPC: "wss://node-dev.allfeat.io"
            };
        }
        // Backward compatibility
        window.MASSLOAD_CONFIG = window.ALLFEAT_CONFIG;
    </script>
    <link data-trunk rel="rust" data-wasm-opt="z" data-target-name="allfeat_hub_frontend"/>
</head>
<body>
    <!-- Leptos will mount here -->
</body>
</html>
