<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass Load Rust - Allfeat</title>
    <!-- Google Fonts for CJK support (Korean, Japanese, Chinese) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link data-trunk rel="css" href="style/main.css">
    <link data-trunk rel="css" href="style/accordion.css">
    <link data-trunk rel="copy-dir" href="public/">
    <!-- Runtime config for external services (blockchain RPC) -->
    <script src="/config.js"></script>
    <!-- Fallback config for local development -->
    <script>
        if (!window.MASSLOAD_CONFIG) {
            console.log("[MassLoad] No runtime config found, using defaults");
            window.MASSLOAD_CONFIG = {
                BLOCKCHAIN_RPC: "wss://node-dev.allfeat.io"
            };
        } else {
            console.log("[MassLoad] Runtime config loaded:", window.MASSLOAD_CONFIG);
        }
    </script>
    <link data-trunk rel="rust" data-wasm-opt="z" data-target-name="frontend_rust"/>
</head>
<body>
    <!-- Leptos will mount here -->
</body>
</html>
