name: Deploy Frontend to Dev (Build & Update Infra)

on:
  push:
    branches:
      - "develop"
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-dev.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: allfeat/massload-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment:
      name: dev
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout App Code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=develop

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-infrastructure-repo:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: 
      name: dev
    steps:
      - name: Checkout Infrastructure Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.INFRA_REPO_OWNER }}/${{ vars.INFRA_REPO_NAME }}
          token: ${{ secrets.CI_INFRA_KUBE_PAT }}
          path: infrastructure
          ref: master

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Image Tag in Dev Overlay
        env:
          NEW_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          OVERLAY_PATH: kubernetes/apps/massload-frontend/overlays/dev
        run: |
          cd infrastructure/$OVERLAY_PATH
          echo "Updating image to: $NEW_IMAGE"
          kustomize edit set image IMAGE_PLACEHOLDER=$NEW_IMAGE

      - name: Fix ConfigMap BACKEND_URL (Mixed Content Fix)
        env:
          OVERLAY_PATH: kubernetes/apps/massload-frontend/overlays/dev
        run: |
          cd infrastructure/$OVERLAY_PATH
          
          echo "🔧 Fixing BACKEND_URL in ConfigMap..."
          
          # Check if configmap patch exists
          if [ -f configmap.yaml ]; then
            echo "📝 Updating existing configmap.yaml"
            sed -i 's|BACKEND_URL:.*|BACKEND_URL: "https://massload-dev.allfeat.org"|' configmap.yaml
          else
            echo "📝 Creating configmap.yaml patch"
            cat > configmap.yaml << 'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: massload-config
          data:
            BACKEND_URL: "https://massload-dev.allfeat.org"
            BLOCKCHAIN_RPC: "wss://node-dev.allfeat.io"
            RUST_LOG: "info"
          EOF
            
            # Add to kustomization resources if not present
            if ! grep -q "configmap.yaml" kustomization.yaml 2>/dev/null; then
              echo "  - configmap.yaml" >> kustomization.yaml
            fi
          fi
          
          echo "✅ ConfigMap fixed with public HTTPS URL"
          cat configmap.yaml

      - name: Commit and Push Changes
        run: |
          cd infrastructure
          git config user.name "CI Pipeline"
          git config user.email "ci@bot.com"
          
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "ci(dev): deploy frontend ${{ github.sha }} + fix BACKEND_URL"
            git push origin master
          else
            echo "No changes to commit"
          fi
