name: Deploy Backend to Dev (Build & Update Infra)

on:
  push:
    branches:
      - "develop"
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-dev.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: allfeat/massload-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment:
      name: dev
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout App Code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=develop

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-infrastructure-repo:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: 
      name: dev
    steps:
      - name: Checkout Infrastructure Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.INFRA_REPO_OWNER }}/${{ vars.INFRA_REPO_NAME }}
          token: ${{ secrets.CI_INFRA_KUBE_PAT }}
          path: infrastructure
          ref: master

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Image Tag in Dev Overlay
        env:
          OVERLAY_PATH: kubernetes/apps/massload-backend/overlays/dev
        run: |
          cd infrastructure/$OVERLAY_PATH
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "Updating image to: $NEW_IMAGE"
          kustomize edit set image IMAGE_PLACEHOLDER=$NEW_IMAGE

      - name: Commit and Push Changes
        run: |
          cd infrastructure
          git config user.name "CI Pipeline"
          git config user.email "ci@bot.com"
          
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "ci(dev): deploy version ${{ github.sha }} to dev"
            git push origin master
          else
            echo "No changes to commit"
          fi

  purge-cloudflare-cache:
    needs: update-infrastructure-repo
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Purge Cloudflare Cache for massload-dev.allfeat.org
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "🔄 Purging Cloudflare cache for massload-dev.allfeat.org..."
          
          response=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{
              "hosts": [
                "massload-dev.allfeat.org"
              ]
            }')
          
          success=$(echo "$response" | jq -r '.success')
          
          if [ "$success" = "true" ]; then
            echo "✅ Cloudflare cache purged successfully!"
            echo "Response: $response" | jq '.'
          else
            echo "❌ Failed to purge Cloudflare cache"
            echo "Response: $response" | jq '.'
            exit 1
          fi
