# MassLoad - Docker Compose
# Usage: docker-compose up --build

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Note: BACKEND_URL is used by the browser (not the container)
      # For local dev, use localhost since backend is exposed on host port 3000
      - BACKEND_URL=http://localhost:3000
      - BLOCKCHAIN_RPC=wss://node-dev.allfeat.io
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
