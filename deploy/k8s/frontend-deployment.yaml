apiVersion: apps/v1
kind: Deployment
metadata:
  name: massload-frontend
  namespace: massload
  labels:
    app.kubernetes.io/name: massload
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: massload
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: massload
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/allfeat/massload-frontend:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: massload-config
                  key: BACKEND_URL
            - name: BLOCKCHAIN_RPC
              valueFrom:
                configMapKeyRef:
                  name: massload-config
                  key: BLOCKCHAIN_RPC
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10

