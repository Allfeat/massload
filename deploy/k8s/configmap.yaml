apiVersion: v1
kind: ConfigMap
metadata:
  name: massload-config
  namespace: massload
  labels:
    app.kubernetes.io/name: massload
data:
  # Backend config
  RUST_LOG: "info"
  # Frontend runtime config
  # ⚠️ Use public HTTPS URL for backend (not internal K8s service)
  BACKEND_URL: "https://api.massload-dev.allfeat.org"
  BLOCKCHAIN_RPC: "wss://node-dev.allfeat.io"

